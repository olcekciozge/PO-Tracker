{# Parola sıfırlama adımları. Kullanım: {% include "partials/reset_steps.html" with step=2 %} #}
<ol class="po-steps" aria-label="Parola sıfırlama adımları">
  <li class="po-step {% if step == 1 %}is-active{% elif step > 1 %}is-done{% endif %}" {% if step == 1 %}aria-current="step"{% endif %}>
    <span class="po-step-num">{% if step > 1 %}✓{% else %}1{% endif %}</span><span class="po-step-label">E-posta</span>
  </li>
  <li class="po-step-line" aria-hidden="true"></li>
  <li class="po-step {% if step == 2 %}is-active{% elif step > 2 %}is-done{% endif %}" {% if step == 2 %}aria-current="step"{% endif %}>
    <span class="po-step-num">{% if step > 2 %}✓{% else %}2{% endif %}</span><span class="po-step-label">Bağlantı</span>
  </li>
  <li class="po-step-line" aria-hidden="true"></li>
  <li class="po-step {% if step == 3 %}is-active{% elif step > 3 %}is-done{% endif %}" {% if step == 3 %}aria-current="step"{% endif %}>
    <span class="po-step-num">{% if step > 3 %}✓{% else %}3{% endif %}</span><span class="po-step-label">Yeni parola</span>
  </li>
</ol>

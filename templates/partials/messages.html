{% if messages %}
  <div class="po-messages" aria-live="polite">
    {% for message in messages %}
      <div class="po-alert {% if message.tags == 'error' %}po-alert-danger{% elif message.tags %}po-alert-{{ message.tags }}{% endif %}" role="alert">
        <span>{{ message }}</span>
        <button type="button" class="po-alert-close" aria-label="Kapat" onclick="this.parentElement.remove()">×</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
